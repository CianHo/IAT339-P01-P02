<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <title>Checkout</title>

    <link href="css/main.css" rel="stylesheet" />
  </head>
</html>
<body>
  <!-- navigation bar.   add logo? -->
  <nav class="nav-main qurova-text">
    <a href="#home" class="nav-main-item logo">
      <img src="img\Logo.png" class="logo-image"
    /></a>
    <a href="index.html" class="nav-main-item button-nav">Home</a>
    <a href="product_listing.html" class="nav-main-item button-nav">Products</a>
    <a href="#services" class="nav-main-item button-nav">Services</a>
    <a href="index.html" class="nav-main-item button-nav">About</a>
    <a href="#contact" class="nav-main-item button-nav">Contact Us</a>
    <form class="text-input search-bar">
      <label for="search-bar" class="text-input-label"
        ><input
          class="text-input-box"
          type="text"
          id="search-bar"
          name="search-bar"
          placeholder="Search"
      /></label>
    </form>
  </nav>
  <div class="spacer-top"></div>

  <div class="checkout-container">
    <div class="cart-and-total-container">
      <div id="product-list">
        <div id="cart-info">
          <!-- the cart -->
          <p class="cart-label left-box">Product</p>
          <p class="cart-label middle-box">Units</p>
          <p class="cart-label right-box">Price</p>
        </div>
        <div class="product-listing">
          <div class="product-name">
            <img
              class="product-name-img"
              src="img/tajin.jpg"
              alt="A bottle of Tajin brand seasoning"
            />
            <p class="product-name-label">Tajin</p>
          </div>
          <p class="product-unit">50</p>
          <p class="product-price">499.50</p>
        </div>
        <div class="product-listing">
          <div class="product-name">
            <img
              class="product-name-img"
              src="img/Manzana.jpg"
              alt="A bottle filled with a pink liquid"
            />
            <p class="product-name-label">Postobon Manzana</p>
          </div>
          <p class="product-unit">70</p>
          <p class="product-price">489.30</p>
        </div>
      </div>

      <div id="checkout-total">
        <!-- price totals -->
        <div class="charge-name">
          <p>Subtotal</p>
          <p>Taxes</p>
          <p>Total</p>
        </div>
        <div class="charge-amount">
          <p>$988.80</p>
          <p>$118.66</p>
          <p>$1107.46</p>
        </div>
        <!--Learned that an element can have more than one class here: https://www.w3schools.com/html/html_classes.asp-->
      </div>
    </div>

    <form id="payment-form">
      <!-- payment form -->
      <h4>Payment Method</h4>
      <fieldset id="payment-selector">
        <div>
          <input type="radio" id="mastercard" name="rad_btn" value="MCard" />
          <label for="mastercard">Mastercard</label>
        </div>
        <div>
          <input type="radio" id="visa" name="rad_btn" value="Visa" />
          <label for="visa">Visa</label>
        </div>
        <div>
          <input type="radio" id="amex" name="rad_btn" value="AmEx" />
          <label for="amex">American Express</label>
        </div>
      </fieldset>
      <fieldset id="card-info">
        <input type="text" placeholder="Card Number" />
        <div class="card-info-security">
          <input type="text" placeholder="Expiration Date (MM/YY)" />
          <input type="text" placeholder="Security Code" />
        </div>
        <input type="text" placeholder="Name On Card" />
      </fieldset>
      <h4>Billing address</h4>
      <fieldset id="billing">
        <div class="billing-name">
          <input type="text" placeholder="First Name" />
          <input type="text" placeholder="Last Name" />
        </div>
        <input type="text" placeholder="Company" />
        <input type="text" placeholder="Address" />
        <div class="billing-location">
          <input type="text" placeholder="City" />
          <input type="text" placeholder="Province" />
          <input type="text" placeholder="Postal Code" />
        </div>
        <input type="text" placeholder="Phone" />
        <input type="text" placeholder="Email" />
      </fieldset>
      <input type="submit" name="payment" value="Pay Now" />
    </form>
  </div>

  <footer>
    <a href="guide.html" class="footer-item">Citations</a>
    <a href="guide.html" class="footer-item">Style Guide</a>
  </footer>
</body>
