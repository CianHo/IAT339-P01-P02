<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <title>Contact Us</title>

    <link href="css/main.css" rel="stylesheet" />
  </head>

  <body>
    <nav class="nav-main qurova-text">
        <a href="#home" class="nav-main-item logo">
        <img src="img\Logo.png" class="logo-image"
        /></a>
        <a href="index.html" class="nav-main-item button-nav">Home</a>
        <a href="product_listing.html" class="nav-main-item button-nav">Products</a>
        <a href="#services" class="nav-main-item button-nav">Services</a>
        <a href="index.html" class="nav-main-item button-nav">About</a>
        <a href="#contact" class="nav-main-item button-nav">Contact Us</a>
        <form class="text-input search-bar">
        <label for="search-bar" class="text-input-label"
            ><input
            class="text-input-box"
            type="text"
            id="search-bar"
            name="search-bar"
            placeholder="Search"
        /></label>
        </form>
    </nav>

    <div id="contact">
        <h1>Contact Us</h1>
        <div id="contact-info">
            <p>Questions? Need help with an order?</p>
            <form id="contact-form">
                <div class="contact-field">
                    <label for="customer-name">Name:</label>
                    <input type="text" id="customer-name">
                </div>
                <div class="contact-field">
                    <label for="customer-email">Email:</label>
                    <input type="text" id="customer-name">
                </div>
                <div class="contact-field">
                    <label for="customer-company">Company Name:</label>
                    <input type="text" id="customer-company">
                </div>
                <div class="contact-field">
                    <label for="customer-order">Order Number (If Applicable):</label>
                    <input type="text" id="customer-order">
                </div>
                <div class="contact-field">
                    <label for="customer-inquiry">Reason for Inquiry:</label>
                    <!-- Learned about <select> here: https://www.w3schools.com/tags/tag_select.asp-->
                    <!-- Learned about the "selected" attribute here: https://www.w3schools.com/tags/att_option_selected.asp-->
                    <select id="customer-inquiry">
                        <option value="default" selected>Select a Reason</option>
                        <option value="question">Question about Product/Service</option>
                        <option value="issue">Issue with Order</option>
                        <option value="complaint">Complaint</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="contact-field">
                    <label for="customer-message">Message:</label>
                    <!-- Learned about <textarea> here: https://www.w3schools.com/tags/tag_textarea.asp-->
                    <textarea id="customer-message" placeholder="Enter question or details here" rows="6" cols="60"></textarea>
                </div>
                <input type="submit" name="payment" value="Submit" />
            </form>
            <p id="contact-fast">Need an faster response? Calls us during regular business hours at: (778)-339-3821</p>
        </div>
    </div>

    <footer>
      <a href="guide.html" class="footer-item">Citations</a>
      <a href="guide.html" class="footer-item">Style Guide</a>
    </footer>
  </body>
</html>
